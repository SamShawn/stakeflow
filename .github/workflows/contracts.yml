name: Contracts

on:
  push:
    branches: [main]
    paths:
      - 'packages/contracts/**'
      - 'packages/shared/src/abis/**'
      - '.github/workflows/contracts.yml'
  pull_request:
    paths:
      - 'packages/contracts/**'
      - 'packages/shared/src/abis/**'
      - '.github/workflows/contracts.yml'

concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Show Foundry version
        run: forge --version

      - name: Build contracts
        working-directory: packages/contracts
        run: forge build --sizes

      - name: Run tests
        working-directory: packages/contracts
        run: forge test -vvv

      - name: Generate gas snapshot
        working-directory: packages/contracts
        run: forge snapshot

      - name: Upload gas snapshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gas-snapshot
          path: packages/contracts/.gas-snapshot
          retention-days: 7

      - name: Check coverage
        working-directory: packages/contracts
        run: forge coverage --report summary

  slither:
    name: Slither Analysis
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run Slither
        uses: crytic/slither-action@v0.4.0
        with:
          target: packages/contracts/
          fail-on: high
          slither-args: '--exclude-dependencies --filter-paths "lib|test"'
          sarif: results.sarif

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: results.sarif
          category: slither
